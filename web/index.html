<!doctype html>
<html lang="sv">
<title>Pluggkompis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pluggkompis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131c" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: ett linjerat skrivhäfte. Smal läsyta, en fråga per vy, bläckblå accent och röd marginallinje bara på frågekortet. */
:root {
  --paper: #f3f5fa;
  --sheet: #ffffff;
  --ink: #1a2132;
  --ink-2: #545f75;
  --rule: #dde4f0;
  --rule-strong: #c4cfe2;
  --pen: #2148c0;
  --pen-ink: #ffffff;
  --pen-soft: #e7ecfb;
  --margin: #d65450;
  --good: #1b7a4e;
  --good-soft: #e1f3e9;
  --warn: #8f5c0c;
  --warn-soft: #fbf0db;
  --bad: #b02f2a;
  --bad-soft: #f9e2e0;
  --focus: #2148c0;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 14px;
  --tap: 48px;
  /* Häftesomslag per ämne */
  --cover-1: #2f4fb8; --cover-2: #0d7466; --cover-3: #b23a47; --cover-4: #6d45a6; --cover-5: #b8710f; --cover-6: #33743a;
  --cover-ink: #ffffff;
  --label: #fffdf6;
  --shadow: 0 1px 2px rgb(20 30 60 / 0.06), 0 6px 18px rgb(20 30 60 / 0.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f131c; --sheet: #171d2a; --ink: #e7ebf4; --ink-2: #a2acc1; --rule: #252e40; --rule-strong: #34405a;
    --pen: #86a5ff; --pen-ink: #0c1120; --pen-soft: #1c2745; --margin: #e2797a;
    --good: #61cc98; --good-soft: #13301f; --warn: #e6b45f; --warn-soft: #33270f; --bad: #f2837d; --bad-soft: #3b1c1b; --focus: #a8bdff;
    --cover-1: #7d93ea; --cover-2: #45b3a3; --cover-3: #e2808a; --cover-4: #ab8be0; --cover-5: #e4a64f; --cover-6: #78bb7f; --cover-ink: #10141c; --label: #1d2433; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 20px rgb(0 0 0 / 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f131c; --sheet: #171d2a; --ink: #e7ebf4; --ink-2: #a2acc1; --rule: #252e40; --rule-strong: #34405a;
  --pen: #86a5ff; --pen-ink: #0c1120; --pen-soft: #1c2745; --margin: #e2797a;
  --good: #61cc98; --good-soft: #13301f; --warn: #e6b45f; --warn-soft: #33270f; --bad: #f2837d; --bad-soft: #3b1c1b; --focus: #a8bdff;
  --cover-1: #7d93ea; --cover-2: #45b3a3; --cover-3: #e2808a; --cover-4: #ab8be0; --cover-5: #e4a64f; --cover-6: #78bb7f; --cover-ink: #10141c; --label: #1d2433; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 20px rgb(0 0 0 / 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.5rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--ink-2); }
.small { font-size: 0.88rem; }
.center { text-align: center; }
.eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 700; }

.top { border-bottom: 1px solid var(--rule); background: var(--paper); padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.top-inner, .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.theme-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 10px; border-radius: 999px; border: 1.5px solid var(--rule-strong); background: var(--sheet); color: var(--ink); cursor: pointer; font-weight: 700; font-size: .9rem; }
@media (max-width: 480px) { .theme-label { display: none; } .theme-btn { width: 44px; padding: 0; justify-content: center; } }
.theme-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.theme-opt { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px 0 8px; border-radius: 12px; border: 2px solid var(--rule); background: var(--sheet); cursor: pointer; font-weight: 700; }
.theme-opt.on { border-color: var(--pen); background: var(--pen-soft); }
.theme-swatch { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--rule-strong); }
.theme-opt.light .theme-swatch { background: #ffffff; }
.theme-opt.dark .theme-swatch { background: #171d2a; }
.theme-opt.auto .theme-swatch { background: linear-gradient(135deg, #ffffff 50%, #171d2a 50%); }
.wordmark { background: none; border: 0; padding: 4px 0; cursor: pointer; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em;
  background-image: linear-gradient(var(--pen), var(--pen)); background-size: 100% 3px; background-position: 0 92%; background-repeat: no-repeat; }
.wrap { padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.boot { padding-top: 40px; }

.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
.hero.tight { padding-top: 0; }
.lead { font-size: 1.1rem; color: var(--ink-2); max-width: 60ch; }

.btn { min-height: var(--tap); padding: 0 20px; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 0.92rem; }
.btn.primary { background: var(--pen); color: var(--pen-ink); }
.btn.ghost { background: transparent; border-color: var(--rule-strong); }
.btn.bad { background: var(--bad); color: var(--sheet); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--pen); cursor: pointer; padding: 8px 4px; min-height: 44px; font-weight: 700; }
.back { align-self: flex-start; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; }

.notice { padding: 12px 16px; border-radius: 10px; background: var(--pen-soft); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.working { display: flex; gap: 10px; align-items: center; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--rule-strong); border-top-color: var(--pen); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { color: var(--ink-2); padding: 16px; border: 1.5px dashed var(--rule-strong); border-radius: var(--radius); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; }
.form { display: flex; flex-direction: column; gap: 8px; }
.form h2 { margin-bottom: 8px; }
.form.narrow { max-width: 420px; width: 100%; margin: 24px auto 0; }
.form.inset { background: var(--paper); }
label { font-weight: 700; font-size: 0.95rem; margin-top: 6px; }
.hint { font-size: 0.88rem; color: var(--ink-2); }
input, select, textarea { width: 100%; min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--rule-strong); border-radius: 10px; background: var(--sheet); }
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--pen); outline: none; box-shadow: 0 0 0 3px var(--pen-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2 > * { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }

/* Start: namnlappar i barnets färg */
.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 220px)); justify-content: center; gap: 16px; }
.profile { --c: var(--pen); position: relative; background: color-mix(in srgb, var(--c) 9%, var(--sheet)); border: 1.5px solid color-mix(in srgb, var(--c) 30%, var(--rule)); border-radius: 20px; padding: 26px 14px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-height: 190px; box-shadow: var(--shadow); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.profile-name { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; margin-top: 6px; }
.profile-grade { font-size: 0.85rem; font-weight: 700; color: var(--ink-2); background: var(--sheet); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); }
.avatar { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 2rem; color: #fff; background: var(--c, var(--pen)); box-shadow: 0 0 0 5px var(--sheet); }
.list-row .avatar, .avatar.sm { width: 32px; height: 32px; font-size: 0.95rem; box-shadow: none; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.swatch { width: 48px; height: 48px; border-radius: 50%; cursor: pointer; background: var(--sw, var(--c, var(--pen))); border: 4px solid var(--sheet); box-shadow: 0 0 0 1.5px var(--rule-strong); }
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }
.parent-link { margin-top: 8px; }

/* Förälder */
.block { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; border-top: 1px solid var(--rule); }
.block-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; cursor: pointer; text-align: left; }
.lr-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.lr-main > span.muted { flex-basis: 100%; }
.chip { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--pen-soft); color: var(--pen); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--rule); font-weight: 700; font-size: 0.92rem; color: var(--ink-2); }
.step-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); font-variant-numeric: tabular-nums; }
.steps li.done { color: var(--good); border-color: var(--good); }
.steps li.done .step-n { background: var(--good); color: var(--sheet); }

.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 24px 16px; border: 2px dashed var(--rule-strong); border-radius: var(--radius); background: var(--sheet); cursor: pointer; }
.drop.small { padding: 14px 16px; }
.drop.over { border-color: var(--pen); background: var(--pen-soft); }
.drop.disabled { opacity: 0.5; cursor: not-allowed; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.drop-label { font-weight: 700; color: var(--pen); }
.pending { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.pending li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 4px 12px; background: var(--sheet); border-radius: 10px; flex-wrap: wrap; }
.pending li span:first-child { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }

.materials { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.materials details { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; }
.materials summary { padding: 12px 16px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-height: 48px; }
.materials summary .muted { flex-basis: 100%; }
.ref { font-family: var(--f-display); font-weight: 800; font-size: 0.8rem; color: var(--pen); background: var(--pen-soft); padding: 2px 8px; border-radius: 6px; }
.page-text { padding: 0 16px 16px; }
.page-text pre { white-space: pre-wrap; font-family: var(--f-body); font-size: 0.92rem; margin: 6px 0 0; padding: 12px; background: var(--paper); border-radius: 8px; overflow-wrap: anywhere; }

.oos { font-size: 0.92rem; padding: 10px 14px; border-radius: 10px; background: var(--paper); border: 1px solid var(--rule); }
.goals { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.goal { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.goal.attention { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
.goal-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.goal-top select { width: auto; min-height: 40px; padding: 6px 10px; font-size: 0.9rem; }
.goal-text { font-weight: 700; }
.goal-meta { display: flex; gap: 8px 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.goal-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.needs { background: var(--warn-soft); color: var(--ink); padding: 10px 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
.needs strong { color: var(--warn); }
.type { font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--pen-soft); color: var(--pen); }
.sources { display: flex; gap: 6px; flex-wrap: wrap; }
.src { font-size: 0.8rem; padding: 2px 8px; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-2); overflow-wrap: anywhere; }

.pips { display: inline-flex; gap: 4px; align-items: center; }
.pip { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--pen); }
.pip.now { background: linear-gradient(135deg, var(--pen) 50%, transparent 50%); }
.pip.full { background: var(--pen); }
.pip.later { border-style: dashed; border-color: var(--rule-strong); }
.pip.na { border-color: var(--rule-strong); opacity: 0.7; }

.bank summary { cursor: pointer; font-weight: 700; color: var(--pen); min-height: 44px; display: flex; align-items: center; }
.bank-goal { padding: 12px 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
.bank-items { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.bank-items li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; }
.bank-items li > div { min-width: 0; overflow-wrap: anywhere; }
.danger-zone { align-items: flex-start; }

/* Provhuvud och flikar */
.test-head { --cover: var(--pen); display: flex; gap: 18px; align-items: stretch; }
.th-cover { flex: none; width: 64px; border-radius: 4px 12px 12px 4px; background: var(--cover); background-image: repeating-linear-gradient(135deg, rgb(255 255 255 / 0.07) 0 2px, transparent 2px 9px); box-shadow: inset 8px 0 0 rgb(0 0 0 / 0.14); }
.th-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
@media (max-width: 520px) { .th-cover { width: 14px; } }
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; min-height: 48px; padding: 0 16px; border: 0; background: none; cursor: pointer; font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1.5px; display: inline-flex; align-items: center; gap: 8px; }
.tab.on { color: var(--pen); border-bottom-color: var(--pen); }
.badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--warn); color: var(--sheet); font-size: 0.75rem; display: inline-grid; place-items: center; }
.tabpanel { display: flex; flex-direction: column; gap: 20px; }
.tabpanel > .block:first-child { border-top: 0; padding-top: 0; }
.block.flat { border-top: 0; padding-top: 0; }
.test-row { --cover: var(--pen); box-shadow: inset 6px 0 0 var(--cover); padding-left: 20px; }

/* Framsteg (förälder) */
.lr-stats { flex-basis: 100%; color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0; }
.stats > div { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stats dt { font-size: 0.8rem; color: var(--ink-2); font-weight: 700; }
.stats dd { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stats .unit { font-family: var(--f-body); font-weight: 400; font-size: 0.85rem; color: var(--ink-2); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.days { margin: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.day-bars { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.day-stack { height: 96px; width: 100%; max-width: 26px; display: flex; flex-direction: column; justify-content: flex-end; border-bottom: 1px solid var(--rule-strong); }
.seg { display: block; width: 100%; }
.seg.right, .sw.right { background: var(--good); }
.seg.almost, .sw.almost { background: var(--warn); }
.seg.wrong, .sw.wrong { background: var(--bad); }
.day-stack .seg:first-child { border-radius: 4px 4px 0 0; }
.day-n { font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--ink-2); min-height: 1em; }
.day-label { font-size: 0.75rem; color: var(--ink-2); white-space: nowrap; min-height: 1em; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.disputes { display: flex; flex-direction: column; gap: 8px; }
.dispute { background: var(--sheet); border: 1px solid var(--warn); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.pre { white-space: pre-line; }
.table-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; }
.goal-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 560px; }
.goal-table th, .goal-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.goal-table th { font-size: 0.78rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; }
.goal-table tr:last-child td { border-bottom: 0; }
.goal-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal-table .low { color: var(--bad); font-weight: 700; }

/* Dagsplan */
.date-edit { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.date-edit label { margin: 0; }
.date-edit input { width: auto; }
.schedule { border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
.schedule legend { font-weight: 700; padding: 0 6px; }
.weekdays { display: flex; gap: 6px; flex-wrap: wrap; }
.wd { margin: 0; min-width: 52px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--rule-strong); border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.9rem; background: var(--sheet); }
.wd input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.wd.on { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.wd:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.range-in { display: flex; align-items: center; gap: 6px; }
.range-in input { width: 76px; text-align: center; font-variant-numeric: tabular-nums; }
.plan-days { list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; }
.pd { display: grid; grid-template-columns: 8.5rem 5.5rem minmax(0, 1fr) 6.5rem 3.5rem; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--rule); min-height: 48px; }
.pd:last-child { border-bottom: 0; }
.pd.today { background: var(--pen-soft); }
.pd.past { color: var(--ink-2); }
.pd.off .pd-date { text-decoration: line-through; color: var(--ink-2); }
.pd-date { font-weight: 700; font-size: 0.92rem; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.pd-tr { font-size: 0.72rem; font-weight: 700; color: var(--warn); }
.pd-phase { font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--paper); text-align: center; }
.ph-bygga { background: var(--pen-soft); color: var(--pen); }
.ph-befasta { background: var(--good-soft); color: var(--good); }
.ph-off { color: var(--ink-2); }
.pd-bar { position: relative; height: 12px; border-radius: 999px; background: var(--paper); overflow: hidden; }
.pd-plan { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--rule-strong); }
.pd-done { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--good); }
.pd-min { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.pd-toggle { min-height: 40px; padding: 4px; font-size: 0.85rem; }
@media (max-width: 600px) {
  .pd { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "date phase toggle" "bar bar min"; row-gap: 6px; }
  .pd-date { grid-area: date; } .pd-phase { grid-area: phase; } .pd-toggle { grid-area: toggle; } .pd-bar { grid-area: bar; } .pd-min { grid-area: min; }
}
.tc-today { font-size: 1rem; }
.today-chip { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.today-bar { display: flex; flex-direction: column; gap: 6px; }
.jump { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 4px; }

/* Barn: dagens pass och häftesomslag */
.child { display: flex; flex-direction: column; gap: 20px; }
.section-title { font-size: 1.1rem; color: var(--ink-2); margin-top: 4px; }
.today-card { --cover: var(--pen); display: flex; gap: 22px; align-items: center; padding: 22px; border-radius: 22px; background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.today-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: var(--cover); }
.today-text { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.today-text h2 { font-size: 1.4rem; }
.btn.big { min-height: 56px; padding: 0 30px; font-size: 1.1rem; margin-top: 6px; }
@media (max-width: 520px) { .today-card { flex-direction: column; text-align: center; } .today-text { align-items: center; } }
.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; }
.ring circle:last-child { transition: stroke-dasharray 0.6s ease; }
.ring-label { position: relative; display: flex; flex-direction: column; align-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-label small { font-family: var(--f-body); font-weight: 700; font-size: 0.72rem; color: var(--ink-2); margin-top: 4px; }

.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 300px)); gap: 18px; }
.cover { --cover: var(--pen); text-align: left; padding: 0; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; gap: 10px; border-radius: 14px; }
.cover-front { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 6px 16px 16px 6px; background: var(--cover);
  background-image: repeating-linear-gradient(135deg, rgb(255 255 255 / 0.06) 0 2px, transparent 2px 9px);
  box-shadow: inset 10px 0 0 rgb(0 0 0 / 0.14), var(--shadow); transition: transform 0.15s ease; }
.cover-label { background: var(--label); border-radius: 10px; padding: 12px 16px; min-width: 64%; max-width: 86%; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 0 rgb(0 0 0 / 0.08); }
@media (max-width: 520px) { .cover-front { aspect-ratio: 16 / 7; } }
.cl-subject { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; color: var(--ink); overflow-wrap: anywhere; }
.cl-when { font-size: 0.85rem; color: var(--ink-2); }
.cover-foot { display: flex; flex-direction: column; gap: 6px; padding: 0 2px; }
.cf-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; font-weight: 700; flex-wrap: wrap; }
.bar { height: 10px; border-radius: 999px; background: var(--rule); overflow: hidden; display: block; }
.bar span { display: block; height: 100%; background: var(--good); border-radius: 999px; transition: width 0.4s ease; }

.practice { --cover: var(--pen); display: flex; flex-direction: column; gap: 16px; }
.practice-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.counter { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.qcard { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 24px 22px 24px 44px; display: flex; flex-direction: column; gap: 18px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px); background-position: 0 70px; }
.qcard::before { content: ""; position: absolute; top: 0; bottom: 0; left: 26px; width: 2px; background: var(--margin); opacity: 0.55; }
.q-goal { font-size: 0.85rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.q-subject { font-weight: 700; color: var(--cover); }
.q-level { display: inline-flex; align-items: center; gap: 8px; }
.q-free { font-weight: 700; color: var(--pen); }
.trail { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; flex: 1; min-width: 0; max-width: 360px; }
.trail li { flex: 1; height: 8px; border-radius: 999px; background: var(--rule); }
.trail li.right { background: var(--good); }
.trail li.almost { background: var(--warn); }
.trail li.wrong { background: var(--bad); opacity: 0.75; }
.trail li.now { background: var(--pen); opacity: 0.45; }
.practice-top .btn { flex: none; }
.q { font-family: var(--f-body); font-size: 1.4rem; font-weight: 700; line-height: 1.4; }
.young .q { font-size: 1.6rem; }
.young .option, .young .answer { font-size: 1.25rem; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option { text-align: left; min-height: 60px; padding: 12px 18px; border-radius: 14px; border: 2px solid var(--rule-strong); background: var(--sheet); cursor: pointer; font-size: 1.1rem; }
.option:disabled { cursor: default; }
.option.is-right { border-color: var(--good); background: var(--good-soft); }
.option.is-wrong { border-color: color-mix(in srgb, var(--bad) 60%, var(--rule-strong)); background: var(--sheet); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 70%, transparent); color: var(--ink-2); }
.gap { display: inline-block; min-width: 5ch; border-bottom: 3px solid var(--pen); padding: 0 4px; }
.text-answer { display: flex; flex-direction: column; gap: 12px; }
.answer { font-size: 1.15rem; min-height: 56px; }
.answer.free { line-height: 1.6; background-color: var(--sheet); background-image: repeating-linear-gradient(to bottom, transparent 0 calc(1.6em - 1px), var(--rule) calc(1.6em - 1px) 1.6em); background-attachment: local; padding-top: 10px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checks li { padding-left: 28px; position: relative; }
.checks li::before { position: absolute; left: 0; top: 0; width: 20px; text-align: center; font-weight: 700; }
.checks li.ok::before { content: "✓"; color: var(--good); }
.checks li.no::before { content: "–"; color: var(--bad); }
.checks li.no { color: var(--ink-2); }
.checks.plain li::before { content: "•"; color: var(--ink-2); }
.spinner.inline { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }
.ai-line { padding: 8px 12px; border-left: 3px solid var(--rule-strong); }
.match { display: flex; flex-direction: column; gap: 10px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px; align-items: center; }
.match-row label { margin: 0; overflow-wrap: anywhere; }
.match-row.is-right select { border-color: var(--good); background: var(--good-soft); }
.match-row.is-wrong select { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 520px) { .match-row { grid-template-columns: 1fr; gap: 4px; } .qcard { padding: 20px 16px 20px 36px; } .qcard::before { left: 20px; } }

.feedback { position: relative; border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid var(--rule-strong); background: var(--sheet); box-shadow: var(--shadow); }
.feedback h2 { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; }
.fb-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 1.1rem; flex: none; color: var(--sheet); }
.feedback.right { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.feedback.right h2 { color: var(--good); } .feedback.right .fb-icon { background: var(--good); }
.feedback.almost { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.feedback.almost h2 { color: var(--warn); } .feedback.almost .fb-icon { background: var(--warn); }
.feedback.wrong h2 { color: var(--ink); } .feedback.wrong .fb-icon { background: var(--ink-2); }
.feedback.wrong .answer-line strong { color: var(--good); }
.stamp { position: absolute; top: -14px; right: 18px; transform: rotate(-8deg); pointer-events: none; animation: stamp 0.45s cubic-bezier(.2,1.6,.4,1) both; }
.stamp span { display: block; font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--pen);
  border: 3px solid var(--pen); border-radius: 10px; padding: 4px 12px; background: color-mix(in srgb, var(--sheet) 85%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--pen) 25%, transparent); }
@keyframes stamp { from { transform: rotate(-8deg) scale(1.8); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
.answer-line { white-space: pre-line; }
.levelup { font-weight: 700; color: var(--pen); }
.summary { display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.summary-head { display: flex; gap: 20px; align-items: center; }
@media (max-width: 520px) { .summary-head { flex-direction: column; text-align: center; } }
.ups { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ups li { display: flex; gap: 10px; align-items: baseline; }
.up-tag { flex: none; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--pen); border: 2px solid var(--pen); border-radius: 6px; padding: 1px 6px; transform: rotate(-3deg); }


/* Verktyg i frågan och återkopplingen */
.ico { flex: none; }
.q-tools, .fb-tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tool { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--rule-strong); background: var(--sheet); color: var(--ink); font-weight: 700; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s; }
.tool:active { transform: scale(0.97); }
.q-helped { font-weight: 700; color: var(--warn); }
.mic-tip { display: inline-flex; align-items: center; gap: 6px; }
.hint-line { margin-top: -8px; }

/* Panel */
body.sheet-open { overflow: hidden; }
.sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgb(10 14 24 / 0.35); display: flex; justify-content: flex-end; animation: fade 0.2s ease both; }
.sheet-panel { width: min(480px, 100%); height: 100%; background: var(--sheet); box-shadow: -8px 0 30px rgb(0 0 0 / 0.18); display: flex; flex-direction: column; outline: none; animation: slide-in 0.25s ease both;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-panel.wide { width: min(620px, 100%); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { font-size: 1.15rem; min-width: 0; overflow-wrap: anywhere; }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 640px) {
  .sheet-backdrop { align-items: flex-end; }
  .sheet-panel, .sheet-panel.wide { width: 100%; height: 88%; border-radius: 18px 18px 0 0; animation-name: slide-up; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes slide-in { from { transform: translateX(40px); opacity: 0; } }
@keyframes slide-up { from { transform: translateY(40px); opacity: 0; } }

/* Material */
.src-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: -16px; z-index: 1; margin: 0 -18px; padding: 10px 18px; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.src-page { font-weight: 700; font-variant-numeric: tabular-nums; }
.src-toggle { margin-left: auto; }
.src-legend { display: flex; align-items: center; gap: 8px; margin: 0; font-size: .9rem; color: var(--ink-2); }
.src-swatch { width: 18px; height: 12px; border-radius: 3px; background: color-mix(in srgb, var(--warn) 30%, transparent); border-left: 3px solid var(--warn); }
.src-doc { max-width: 60ch; font-size: 1.06rem; line-height: 1.65; display: flex; flex-direction: column; gap: 10px; }
.src-doc > :first-child { margin-top: 0; }
.src-h1 { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.2; margin: 6px 0 0; text-wrap: balance; }
.src-h { font-family: var(--f-display); font-size: 1.1rem; line-height: 1.25; margin: 14px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--rule); color: var(--ink); text-wrap: balance; }
.src-p { margin: 0; }
.src-gap { height: 2px; }
.src-doc strong { font-weight: 700; color: var(--ink); }
.src-list { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.src-list li::marker { color: var(--pen); font-weight: 700; }
.src-dl { margin: 0; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--sheet); }
.src-def { display: grid; grid-template-columns: minmax(7em, 32%) 1fr; gap: 4px 14px; padding: 10px 14px; }
.src-def + .src-def { border-top: 1px solid var(--rule); }
.src-def dt { font-weight: 700; color: var(--pen); min-width: 0; overflow-wrap: anywhere; }
.src-def dd { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.src-def dd p { margin: 0; }
.src-topic { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.src-topic .src-h { margin-top: 8px; }
.src-parts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.src-parts li { padding: 4px 12px; border-radius: 999px; background: var(--pen-soft); color: var(--ink); font-weight: 700; font-size: .95rem; }
.src-topic.is-hit .src-parts li { background: color-mix(in srgb, var(--warn) 26%, transparent); }
.src-fig { margin: 4px 0; display: flex; flex-direction: column; gap: 8px; }
.src-fig figcaption { font-size: .95rem; color: var(--ink-2); line-height: 1.5; }
.src-fig-tag { display: inline-block; padding: 1px 8px; margin-right: 4px; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule); font-size: .8rem; font-weight: 700; color: var(--ink-2); vertical-align: 1px; }
.src-fig-crop { position: relative; display: block; width: 100%; padding: 0; overflow: hidden; border: 1px solid var(--rule); border-radius: 10px; background: #fff; cursor: zoom-in; }
.src-fig-crop img { position: absolute; max-width: none; height: auto; }
.src-def dd .src-fig-crop { max-width: min(100%, 300px) !important; margin-top: 4px; }
.src-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; align-items: start; }
.src-gallery .src-fig-crop { max-width: 100% !important; }
.src-fig-wait { height: 160px; border-radius: 10px; background: var(--paper); border: 1px dashed var(--rule-strong); }
.src-def.is-hit mark { background: none; padding: 0; }
.src-def.is-hit { background: color-mix(in srgb, var(--warn) 12%, transparent); box-shadow: inset 3px 0 0 var(--warn); }
@media (max-width: 480px) { .src-def { grid-template-columns: 1fr; } }
.src-doc mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--ink); padding: 1px 3px; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; scroll-margin: 80px; }
.src-img { border: 1px solid var(--rule); border-radius: 8px; background: #fff; }

/* Kompisen på barnets startsida och i studion */
.child-hero { flex-direction: row; align-items: center; gap: 14px; }
.hero-kompis { width: 92px; flex: none; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.hero-kompis:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.studio { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 28px; align-items: start; padding-top: 12px; }
.studio-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 18px; border-radius: 22px; border: 1px solid var(--rule); background-color: var(--sheet);
  background-image: repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px); position: sticky; top: 12px; }
.studio-fig { width: min(220px, 100%); }
.studio-name { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; padding: 6px 20px; border-radius: 10px; border: 1px solid var(--rule); background: var(--label); cursor: pointer; box-shadow: 0 1px 0 rgb(0 0 0 / .06); max-width: 100%; overflow-wrap: anywhere; }
.studio-controls { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-weight: 700; }
.chip-btn.on { border-color: var(--pen); background: var(--pen-soft); color: var(--ink); }
.chip-btn.dashed { border-style: dashed; color: var(--ink-2); }
.name-row .answer { max-width: 280px; }
@media (max-width: 640px) { .studio { grid-template-columns: 1fr; } .studio-stage { position: static; } .studio-fig { width: 170px; } }

/* Val när barnet trycker på ett prov */
.test-menu { display: flex; flex-direction: column; gap: 10px; }
.tm-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 14px 16px; min-height: 64px; border-radius: 14px; border: 1.5px solid var(--rule-strong); background: var(--sheet); cursor: pointer; }
.tm-opt.main { border-color: var(--cover); background: color-mix(in srgb, var(--cover) 10%, var(--sheet)); }
.tm-title { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; }
.tm-sub { color: var(--ink-2); font-size: .95rem; }

/* Provläge */
.exam { display: flex; flex-direction: column; gap: 16px; }
.exam-intro { display: flex; flex-direction: column; gap: 14px; }
.exam-rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.exam-count { font-weight: 700; font-variant-numeric: tabular-nums; }
.exam-bar { flex: 1; height: 8px; border-radius: 99px; background: var(--rule); overflow: hidden; min-width: 80px; }
.exam-bar span { display: block; height: 100%; background: var(--cover, var(--pen)); transition: width .3s ease; }
.exam-kompis { width: 120px; align-self: center; }
.exam-kompis.small { width: 84px; margin-left: auto; }
.exam-goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.exam-goals li { display: flex; gap: 12px; align-items: baseline; }
.eg-icons { display: inline-flex; gap: 4px; flex: none; }
.eg-icons i, .er-v { font-style: normal; font-weight: 700; }
.eg-icons i { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-size: .85rem; background: var(--rule); color: var(--ink-2); }
.eg-icons i.v-right { background: var(--good-soft); color: var(--good); }
.eg-icons i.v-almost { background: var(--warn-soft); color: var(--warn); }
.eg-icons i.v-wrong { background: var(--bad-soft); color: var(--bad); }
.exam-review summary { cursor: pointer; font-weight: 700; color: var(--pen); }
.exam-review ol { margin: 10px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 12px; }
.exam-review li { display: flex; flex-direction: column; gap: 3px; }
.er-q { font-weight: 700; }
.v-right .er-v { color: var(--good); } .v-almost .er-v { color: var(--warn); } .v-wrong .er-v, .v-skipped .er-v { color: var(--bad); }
.pre { white-space: pre-line; }
.exam-row { display: flex; gap: 14px; align-items: flex-start; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
